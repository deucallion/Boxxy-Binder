name: Build Windows Executable

on:
  push:
    branches:
      - main
      - master
      - claude/**
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Rust dependencies (Windows)
        run: |
          rustup target add x86_64-pc-windows-msvc

      - name: Install Node dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri:build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Get version from package.json
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $version = $package.version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Upload Windows Installer (MSI)
        uses: actions/upload-artifact@v4
        with:
          name: boxxy-binder-${{ steps.version.outputs.VERSION }}-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows Installer (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: boxxy-binder-${{ steps.version.outputs.VERSION }}-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: boxxy-binder-${{ steps.version.outputs.VERSION }}-windows-exe
          path: src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
